<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2146b8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="가계부">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<script>window.LEDGER_STANDALONE = true;</script>
</head>
<body>
<title>월간 가계부</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: a bank-passbook ledger — month switcher, five-figure summary strip, then ruled sections with 목표/실제 columns */
:root {
  --bg: #eef1f4; --surface: #ffffff; --sunk: #f6f8fa; --ink: #16202b; --muted: #5d6977; --line: #dbe1e8;
  --accent: #2146b8; --accent-soft: #e6ecfb; --good: #1d7a4b; --warn: #a8531a; --bad: #b42318;
  --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1318; --surface: #161d25; --sunk: #1b232d; --ink: #e4e9ef; --muted: #93a0ae; --line: #28323d;
  --accent: #86a2ff; --accent-soft: #1f2a46; --good: #4cc38a; --warn: #f0a565; --bad: #ff7d70; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e1318; --surface: #161d25; --sunk: #1b232d; --ink: #e4e9ef; --muted: #93a0ae; --line: #28323d;
  --accent: #86a2ff; --accent-soft: #1f2a46; --good: #4cc38a; --warn: #f0a565; --bad: #ff7d70; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.5; }
.wrap { max-width: 980px; margin: 0 auto; padding: 20px 16px 48px; display: grid; gap: 18px; }
.num, input.amt { font-family: var(--mono); font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
h1 { font-size: 20px; margin: 0; font-weight: 700; letter-spacing: -0.01em; }
.save-state { font-size: 12px; color: var(--muted); }
.month { display: flex; align-items: center; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.month button { border: 0; background: transparent; width: 32px; height: 32px; border-radius: 7px; font-size: 16px; }
.month button:hover { background: var(--sunk); }
.month strong { min-width: 112px; text-align: center; font-size: 15px; font-family: var(--mono); font-weight: 600; }

.summary { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.summary > div { padding: 14px 16px; border-left: 1px solid var(--line); display: grid; gap: 2px; min-width: 0; }
.summary > div:first-child { border-left: 0; }
.summary label, .summary .k { font-size: 12px; color: var(--muted); letter-spacing: 0.02em; }
.summary .v { font-family: var(--mono); font-size: 18px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.summary .s { font-size: 12px; color: var(--muted); }
.summary input.amt { width: 100%; font-size: 18px; font-weight: 600; border: 0; border-bottom: 1px dashed var(--line); background: transparent; color: var(--ink); padding: 0 0 1px; }
.summary .left .v { color: var(--accent); }
.summary .left.neg .v { color: var(--bad); }

.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; background: transparent; padding: 9px 14px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tools { margin-left: auto; display: flex; gap: 6px; align-items: center; padding-bottom: 6px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 5px 10px; font-size: 12.5px; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

.panel { display: grid; gap: 16px; }
.sec { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 12px 16px; background: var(--sunk); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.sec-h h2 { font-size: 14.5px; margin: 0; font-weight: 700; }
.sec-h .tot { font-family: var(--mono); font-size: 13px; color: var(--muted); }
.sec-h .tot b { color: var(--ink); font-weight: 600; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) 112px 112px 92px; gap: 10px; align-items: center; padding: 7px 16px; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row.head { font-size: 11.5px; color: var(--muted); padding-block: 6px; letter-spacing: 0.03em; }
.row.head span:not(:first-child) { text-align: right; }
.name { min-width: 0; overflow-wrap: anywhere; }
.name input { width: 100%; font: inherit; border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; background: var(--surface); color: var(--ink); }
.name-wrap { display: flex; gap: 6px; align-items: center; min-width: 0; }
.del { border: 0; background: transparent; color: var(--bad); font-size: 16px; padding: 0 4px; line-height: 1; }
input.amt { width: 100%; text-align: right; font-size: 13.5px; border: 1px solid var(--line); border-radius: 6px; padding: 5px 7px; background: var(--surface); color: var(--ink); }
input.amt::placeholder { color: var(--line); }
input.amt:focus { border-color: var(--accent); outline: none; }
.diff { text-align: right; font-family: var(--mono); font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.diff.good { color: var(--good); } .diff.warn { color: var(--warn); } .diff.bad { color: var(--bad); }
.add { display: block; width: 100%; border: 0; border-top: 1px dashed var(--line); background: transparent; padding: 8px 16px; text-align: left; color: var(--accent); font-size: 13px; }
.pos { color: var(--good); } .negv { color: var(--bad); }

.pnl { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.pnl > div { padding: 12px 16px; display: grid; gap: 6px; border-left: 1px solid var(--line); }
.pnl > div:first-child { border-left: 0; }
.pnl label { font-size: 13px; font-weight: 500; }
.pnl .ytd { font-size: 12px; color: var(--muted); }

.memo textarea { width: 100%; min-height: 72px; border: 0; padding: 12px 16px; font: inherit; background: var(--surface); color: var(--ink); resize: vertical; display: block; }

/* subscriptions */
.subrow { display: grid; grid-template-columns: 28px minmax(0, 1.4fr) 104px 64px minmax(0, 1fr) 104px 24px; gap: 8px; align-items: center; padding: 7px 16px; border-bottom: 1px solid var(--line); }
.subrow.head { font-size: 11.5px; color: var(--muted); padding-block: 6px; }
.subrow input[type="text"], .subrow select { width: 100%; font: inherit; font-size: 13px; border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; background: var(--surface); color: var(--ink); min-width: 0; }
.subrow input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); }
.subrow.cancel .sname, .subrow.cancel input.amt { text-decoration: line-through; color: var(--muted); }
.subrow.review { background: color-mix(in srgb, var(--warn) 7%, transparent); }
.subsum { display: flex; flex-wrap: wrap; gap: 8px 24px; padding: 12px 16px; background: var(--sunk); border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.subsum b { font-family: var(--mono); color: var(--ink); font-weight: 600; }

/* annual */
.scroll { overflow-x: auto; }
table.year { border-collapse: collapse; width: 100%; min-width: 640px; font-size: 13px; }
table.year th, table.year td { padding: 8px 12px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
table.year th { font-size: 11.5px; color: var(--muted); font-weight: 500; background: var(--sunk); }
table.year td:first-child, table.year th:first-child { text-align: left; font-family: var(--sans); }
table.year td { font-family: var(--mono); }
table.year tr.cur td { background: var(--accent-soft); }
table.year tfoot td { font-weight: 600; border-top: 2px solid var(--line); border-bottom: 0; }
table.year .empty { color: var(--line); }
.note { font-size: 12.5px; color: var(--muted); margin: 0; }

/* calendar */
.cal-wrap { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.cal .dow { font-size: 11.5px; color: var(--muted); text-align: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
.cal .dow:first-child { color: var(--bad); } .cal .dow:last-child { color: var(--accent); }
.cal button.day { border: 0; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--surface); min-height: 72px; padding: 5px 6px; text-align: left; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.cal button.day:nth-child(7n) { border-right: 0; }
.cal button.day:hover { background: var(--sunk); }
.cal button.day.sel { background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--accent); }
.cal .dn { font-family: var(--mono); font-size: 12px; font-weight: 600; }
.cal .day.sun .dn { color: var(--bad); } .cal .day.sat .dn { color: var(--accent); }
.cal .day.today .dn { background: var(--ink); color: var(--surface); border-radius: 999px; padding: 0 6px; align-self: flex-start; }
.cal .dt { font-family: var(--mono); font-size: 11.5px; color: var(--ink); margin-top: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cal .dc { font-size: 10.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cal .blank { background: var(--sunk); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); min-height: 72px; }
.dayform { display: grid; grid-template-columns: minmax(0, 1fr) 108px; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.dayform input[type="text"], .dayform select { width: 100%; min-width: 0; font: inherit; font-size: 13px; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; background: var(--surface); color: var(--ink); }
.dayform .btn { grid-column: 1 / -1; background: var(--accent); color: var(--surface); border-color: var(--accent); padding: 7px; }
.dayform .btn:hover { color: var(--surface); filter: brightness(1.08); }
.entry { display: grid; grid-template-columns: minmax(0, 1fr) auto 24px; gap: 8px; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--line); }
.entry .meta { font-size: 11.5px; color: var(--muted); }
.entry .num { font-size: 13px; }
.catlist { display: grid; gap: 6px; padding: 12px 16px; }
.catrow { display: grid; grid-template-columns: 64px minmax(0, 1fr) 84px; gap: 8px; align-items: center; font-size: 12.5px; }
.catrow .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.catrow .bar i { display: block; height: 100%; background: var(--accent); }
.catrow .num { text-align: right; }
@media (max-width: 760px) {
  .cal-wrap { grid-template-columns: 1fr; }
  .cal button.day, .cal .blank { min-height: 54px; padding: 4px; }
  .cal .dc { display: none; }
  .cal .dt { font-size: 10px; }
}

/* more */
.rules { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.rule { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 8px; align-content: start; }
.rule.key { border-color: var(--accent); }
.rule .no { font-size: 11.5px; color: var(--accent); font-weight: 600; letter-spacing: 0.04em; }
.rule h3 { margin: 0; font-size: 15px; }
.rule p { margin: 0; color: var(--muted); font-size: 13px; }
.rule .live { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; border-top: 1px dashed var(--line); padding-top: 8px; font-size: 12.5px; flex-wrap: wrap; }
.rule .live b { font-family: var(--mono); font-size: 14px; }
.rule .live .ok { color: var(--good); } .rule .live .ng { color: var(--warn); }
.phases { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.phase { padding: 14px 16px; border-left: 1px solid var(--line); display: grid; gap: 6px; align-content: start; }
.phase:first-child { border-left: 0; }
.phase.now { background: var(--accent-soft); }
.phase .age { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.phase h3 { margin: 0; font-size: 15px; }
.phase ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: 13px; display: grid; gap: 3px; }
.phase .tag { font-size: 11px; font-weight: 600; color: var(--accent); }
@media (max-width: 760px) { .rules, .phases { grid-template-columns: 1fr; } .phase { border-left: 0; border-top: 1px solid var(--line); } .phase:first-child { border-top: 0; } }

/* sheets export */
.export { display: grid; gap: 10px; padding: 14px 16px; }
.export .btns { display: flex; flex-wrap: wrap; gap: 8px; }
.export .msg { font-size: 12.5px; color: var(--good); min-height: 1.2em; }
.export textarea { width: 100%; min-height: 120px; font-family: var(--mono); font-size: 12px; border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: var(--sunk); color: var(--ink); }

/* to-do */
.todo-add { display: flex; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.todo-add input[type="text"] { flex: 1 1 200px; min-width: 0; font: inherit; border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; background: var(--surface); color: var(--ink); }
.todo-add label { display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--muted); }
.todo-add .btn { background: var(--accent); color: var(--surface); border-color: var(--accent); padding: 6px 14px; }
.todo-add .btn:hover { color: var(--surface); filter: brightness(1.08); }
.todo { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto 24px; gap: 10px; align-items: center; padding: 9px 16px; border-bottom: 1px solid var(--line); }
.todo:last-child { border-bottom: 0; }
.todo input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
.todo .txt { min-width: 0; overflow-wrap: anywhere; cursor: pointer; }
.todo.done .txt { text-decoration: line-through; color: var(--muted); }
.chip { font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.chip.rep { color: var(--accent); border-color: var(--accent); }
.todo-empty { padding: 14px 16px; color: var(--muted); font-size: 13px; }
.progress { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; width: 120px; }
.progress i { display: block; height: 100%; background: var(--accent); }

@media (max-width: 760px) {
  .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .summary > div { border-left: 0; border-top: 1px solid var(--line); }
  .summary > div:nth-child(-n+2) { border-top: 0; }
  .summary > div:nth-child(even) { border-left: 1px solid var(--line); }
  .summary .left { grid-column: 1 / -1; border-left: 0 !important; }
  .subrow { grid-template-columns: 24px minmax(0, 1fr) 96px 24px; row-gap: 6px; }
  .subrow > :nth-child(1) { grid-area: 1 / 1; } .subrow > :nth-child(2) { grid-area: 1 / 2; }
  .subrow > :nth-child(3) { grid-area: 1 / 3; } .subrow > :nth-child(4) { display: none; }
  .subrow > :nth-child(5) { grid-area: 2 / 2; } .subrow > :nth-child(6) { grid-area: 2 / 3; }
  .subrow > :nth-child(7) { grid-area: 1 / 4; }
  .subrow.head > :nth-child(5), .subrow.head > :nth-child(6) { display: none; }
}
@media (max-width: 520px) {
  .row { grid-template-columns: minmax(0, 1fr) 92px 92px; }
  .row .diff { grid-column: 1 / -1; text-align: right; margin-top: -4px; font-size: 11.5px; }
  .row .diff:empty { display: none; }
  .row.head span:last-child { display: none; }
  .pnl { grid-template-columns: 1fr; }
  .pnl > div { border-left: 0; border-top: 1px solid var(--line); }
  .pnl > div:first-child { border-top: 0; }
  .tools { width: 100%; margin-left: 0; order: 2; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <div>
      <h1>월간 가계부</h1>
      <div class="save-state" id="saveState">불러오는 중…</div>
    </div>
    <div class="month" role="group" aria-label="월 선택">
      <button id="prevM" aria-label="이전 달">‹</button>
      <strong id="monthLabel">2026.10</strong>
      <button id="nextM" aria-label="다음 달">›</button>
    </div>
  </header>

  <section class="summary" aria-label="이번 달 요약">
    <div><label for="income">월 수입</label><input id="income" class="amt" inputmode="numeric" placeholder="0" autocomplete="off"><span class="s">급여·부수입 합계</span></div>
    <div><span class="k">저축·투자</span><span class="v" id="sumSave">0</span><span class="s" id="saveRate">저축률 –</span></div>
    <div><span class="k">고정지출</span><span class="v" id="sumFixed">0</span><span class="s" id="fixedGoal">예산 0</span></div>
    <div><span class="k">카드값·변동지출</span><span class="v" id="sumCard">0</span><span class="s" id="cardGoal">예산 0</span></div>
    <div class="left" id="leftBox"><span class="k">남은 돈</span><span class="v" id="sumLeft">0</span><span class="s" id="leftPlan">계획 기준 0</span></div>
  </section>

  <div>
    <div class="tabs" role="tablist">
      <button role="tab" id="t-ledger" aria-selected="true">가계부</button>
      <button role="tab" id="t-cal" aria-selected="false">달력</button>
      <button role="tab" id="t-subs" aria-selected="false">구독</button>
      <button role="tab" id="t-todo" aria-selected="false">할 일</button>
      <button role="tab" id="t-year" aria-selected="false">연간</button>
      <button role="tab" id="t-more" aria-selected="false">더보기</button>
      <div class="tools" id="ledgerTools">
        <button class="btn" id="copyPrev">지난달 목표 불러오기</button>
        <button class="btn" id="editBtn">항목 편집</button>
      </div>
    </div>
  </div>

  <main id="view-ledger" class="panel"></main>
  <main id="view-cal" class="panel" hidden></main>
  <main id="view-subs" class="panel" hidden></main>
  <main id="view-todo" class="panel" hidden></main>
  <main id="view-year" class="panel" hidden></main>
  <main id="view-more" class="panel" hidden></main>
</div>

<script>
(() => {
  const DEFAULT_CONFIG = {
    sections: [
      { id: "save", name: "저축·투자", goalLabel: "목표액", actLabel: "실제납입", kind: "save", items: [
        { id: "s_house", name: "주택청약(NH)" }, { id: "s_cma", name: "CMA·현금성적금" },
        { id: "s_irp", name: "IRP(미래에셋)" }, { id: "s_pension", name: "연금저축(신한)" },
        { id: "s_trade", name: "일반매매·기타투자" } ] },
      { id: "fixed", name: "고정지출", goalLabel: "예산", actLabel: "실제", kind: "spend", items: [
        { id: "f_rent", name: "주거비(월세)" }, { id: "f_mgmt", name: "관리비·가스비" },
        { id: "f_loan1", name: "대출이자1(전세)" }, { id: "f_loan2", name: "대출이자2(신용)" },
        { id: "f_kbins", name: "KB보험" }, { id: "f_donate", name: "11청감+각종후원" },
        { id: "f_travel", name: "여행적금" }, { id: "f_parents", name: "엄빠적금" },
        { id: "f_living", name: "생활비통장" }, { id: "f_pingdol", name: "핑돌 적금" } ] },

  const $ = (id) => document.getElementById(id);

  const uid = () => "x" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

  const st = {
    y: new Date().getFullYear(), m: new Date().getMonth() + 1,
    config: clone(DEFAULT_CONFIG), subs: clone(DEFAULT_SUBS), todos: clone(DEFAULT_TODOS), months: {}, tab: "ledger", edit: false, fresh: null
  };
  try { const t = localStorage.getItem("ledger.tab"); if (t) st.tab = t; } catch (e) {}
  const key = (y, m) => `m-${y}-${String(m).padStart(2, "0")}`;
  const cur = () => {
    const k = key(st.y, st.m);
    if (!st.months[k]) st.months[k] = { income: 0, v: {}, pnl: { short: 0, long: 0 }, subsPaid: {}, todoDone: {}, memo: "" };
    const d = st.months[k]; d.v ||= {}; d.pnl ||= { short: 0, long: 0 }; d.subsPaid ||= {}; d.todoDone ||= {};

  };

  /* ---------- storage: private db subtree, else this browser ---------- */
  let store = null; // {write(docId, data)}
  const pending = new Map(); let timer = null; let writing = false;
  function setSaveState(t) { $("saveState").textContent = t; }
  function queue(docId) { pending.set(docId, true); setSaveState("저장 중…"); clearTimeout(timer); timer = setTimeout(flush, 700); }
  async function flush() {
    if (writing || !store) { timer = setTimeout(flush, 300); return; }
    writing = true;
    const ids = [...pending.keys()]; pending.clear();
    try {
      for (const id of ids) {
        const data = id === "config" ? { sections: st.config.sections } : id === "subs" ? { list: st.subs } : id === "todos" ? { list: st.todos } : st.months[id];
        if (data) await store.write(id, clone(data));
      }
      setSaveState(store.label + " · 저장됨");
    } catch (e) {
      setSaveState("저장하지 못했어요. 연결을 확인한 뒤 다시 입력해 주세요.");

  }
  const save = (what) => queue(what === "month" ? key(st.y, st.m) : what);

  function localStore() {

      },
      async write(id, data) {
        let all = {}; try { all = JSON.parse(localStorage.getItem("ledger.data") || "{}"); } catch (e) {}
        all[id] = data; try { localStorage.setItem("ledger.data", JSON.stringify(all)); } catch (e) { throw e; }
      }
    };
  }

  async function connect() {
    let db = null, uidv = null;
    try {
      const claude = window.claude;
      if (claude?.use) {
        const [d, u] = await Promise.all([claude.use("db"), claude.use("user")]);
        db = d; uidv = u ? await u.id() : null;
      }
    } catch (e) {}
    if (db && uidv) {
      const base = "data/users/" + uidv;
      return {
        label: "내 계정에 저장",
        async load() {
          const snap = await db.collection(base).get();
          const out = {}; snap.docs.forEach((d) => { if (d.exists) out[d.id] = d.data(); });
          return out;
        },
        async write(id, data) { await db.doc(base + "/" + id).set(data); }
      };
    }
    return localStore();
  }

  function absorb(all) {

      else if (id === "todos" && Array.isArray(d?.list)) st.todos = clone(d.list);

  }

  /* ---------- totals ---------- */

    const t = {};

      let g = 0, a = 0;

      t[s.id] = { g, a };
    }
    return t;
  }
  function recalc() {
    const d = cur(); const t = totals(d);
    const save = t.save || { g: 0, a: 0 }, fixed = t.fixed || { g: 0, a: 0 }, card = t.card || { g: 0, a: 0 };
    let otherA = 0, otherG = 0;
    for (const s of st.config.sections) if (!["save", "fixed", "card"].includes(s.id)) { otherA += t[s.id].a; otherG += t[s.id].g; }
    $("sumSave").textContent = fmt(save.a);
    $("saveRate").textContent = d.income ? `저축률 ${Math.round(save.a / d.income * 100)}% · 목표 ${fmt(save.g)}` : `목표 ${fmt(save.g)}`;
    $("sumFixed").textContent = fmt(fixed.a + otherA);
    $("fixedGoal").textContent = "예산 " + fmt(fixed.g + otherG);
    $("sumCard").textContent = fmt(card.a);
    $("cardGoal").textContent = "예산 " + fmt(card.g);
    const left = (d.income || 0) - save.a - fixed.a - card.a - otherA;
    const plan = (d.income || 0) - save.g - fixed.g - card.g - otherG;
    $("sumLeft").textContent = fmtSigned(left).replace(/^\+/, "");
    $("leftBox").classList.toggle("neg", left < 0);
    $("leftPlan").textContent = "계획 기준 " + fmtSigned(plan).replace(/^\+/, "");
    for (const s of st.config.sections) {
      const el = document.querySelector(`[data-tot="${s.id}"]`);
      if (el) el.innerHTML = `${s.goalLabel} ${fmt(t[s.id].g)} · ${s.actLabel} <b>${fmt(t[s.id].a)}</b>`;
      for (const it of s.items) {
        const el2 = document.querySelector(`[data-diff="${it.id}"]`); if (!el2) continue;
        const v = d.v[it.id] || {}; const g = v.g || 0, a = v.a || 0;
        el2.className = "diff";
        if (!g && !a) { el2.textContent = ""; continue; }
        const diff = a - g; el2.textContent = diff === 0 ? "목표 달성" : fmtSigned(diff);
        if (s.kind === "save") el2.classList.add(diff >= 0 ? "good" : "warn");
        else el2.classList.add(diff <= 0 ? "good" : (g && diff > g * 0.1 ? "bad" : "warn"));
        if (diff === 0) el2.className = "diff good";
      }
    }
    const ytd = (k) => Object.entries(st.months).filter(([id]) => id.startsWith(`m-${st.y}-`) && id <= key(st.y, st.m)).reduce((s, [, m]) => s + (m.pnl?.[k] || 0), 0);
    const ys = $("ytdShort"), yl = $("ytdLong");
    if (ys) { const v = ytd("short"); ys.innerHTML = `${st.y}년 누적 <span class="num ${v > 0 ? "pos" : v < 0 ? "negv" : ""}">${fmtSigned(v)}</span>`; }
    if (yl) { const v = ytd("long"); yl.innerHTML = `${st.y}년 누적 <span class="num ${v > 0 ? "pos" : v < 0 ? "negv" : ""}">${fmtSigned(v)}</span>`; }
  }

  /* ---------- amount input helper ---------- */

  /* ---------- ledger view ---------- */

  /* ---------- subscriptions ---------- */

  /* ---------- calendar ---------- */
  const CATS = ["식비", "카페·간식", "교통", "쇼핑", "생활용품", "의료·건강", "문화·여가", "경조사·선물", "모임·한턱", "자기계발", "기타"];
  function renderCal() {
    const root = $("view-cal"); root.innerHTML = "";
    const d = cur(); d.cal ||= {};
    const days = new Date(st.y, st.m, 0).getDate();
    const first = new Date(st.y, st.m - 1, 1).getDay();
    const today = new Date(); const isThisMonth = today.getFullYear() === st.y && today.getMonth() + 1 === st.m;
    if (!st.day || st.day > days) st.day = isThisMonth ? today.getDate() : 1;
    const dayTotal = (n) => (d.cal[n] || []).reduce((a, e) => a + (e.amt || 0), 0);
    const monthTotal = Object.keys(d.cal).reduce((a, n) => a + dayTotal(n), 0);

    const wrap = document.createElement("div"); wrap.className = "cal-wrap";
    // grid
    const left = document.createElement("section"); left.className = "sec";
    left.innerHTML = `<div class="sec-h"><h2>${st.m}월 소비 달력</h2><span class="tot">이번 달 <b>${fmt(monthTotal)}</b>원</span></div>`;
    const grid = document.createElement("div"); grid.className = "cal";
    ["일", "월", "화", "수", "목", "금", "토"].forEach((w) => { const e = document.createElement("div"); e.className = "dow"; e.textContent = w; grid.appendChild(e); });
    for (let i = 0; i < first; i++) { const b = document.createElement("div"); b.className = "blank"; grid.appendChild(b); }
    for (let n = 1; n <= days; n++) {
      const dow = (first + n - 1) % 7;
      const b = document.createElement("button"); b.className = "day" + (dow === 0 ? " sun" : dow === 6 ? " sat" : "") + (n === st.day ? " sel" : "") + (isThisMonth && n === today.getDate() ? " today" : "");

  /* ---------- backup (standalone app only) ---------- */
  function backupBox() {
    const sec = document.createElement("section"); sec.className = "sec";
    sec.innerHTML = `<div class="sec-h"><h2>백업·복원</h2><span class="tot">기기를 바꾸거나 다른 폰으로 옮길 때</span></div>`;
    const box = document.createElement("div"); box.className = "export";
    const btns = document.createElement("div"); btns.className = "btns";
    const msg = document.createElement("div"); msg.className = "msg"; msg.setAttribute("role", "status");
    const exp = document.createElement("button"); exp.className = "btn"; exp.textContent = "백업 파일 저장";
    exp.addEventListener("click", () => {
      const all = { config: { sections: st.config.sections }, subs: { list: st.subs }, todos: { list: st.todos }, ...st.months };
      const blob = new Blob([JSON.stringify({ app: "monthly-ledger", v: 1, savedAt: new Date().toISOString(), data: all })], { type: "application/json" });
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
      const t = new Date(); a.download = `가계부-백업-${t.getFullYear()}${String(t.getMonth() + 1).padStart(2, "0")}${String(t.getDate()).padStart(2, "0")}.json`;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      msg.style.color = ""; msg.textContent = "백업 파일을 저장했어요. 다운로드 폴더를 확인하세요.";
    });
    const lab = document.createElement("label"); lab.className = "btn"; lab.textContent = "백업 파일 불러오기"; lab.htmlFor = "restoreFile"; lab.style.display = "inline-block";
    const file = document.createElement("input"); file.type = "file"; file.id = "restoreFile"; file.accept = "application/json,.json"; file.hidden = true;
    file.addEventListener("change", async () => {
      const f = file.files[0]; if (!f) return;
      try {
        const j = JSON.parse(await f.text());
        if (j.app !== "monthly-ledger" || !j.data) throw new Error("bad");
        st.months = {}; absorb(j.data);
        for (const id of Object.keys(j.data)) await store.write(id, j.data[id]);
        render(); msg.style.color = ""; msg.textContent = "백업을 불러왔어요.";
      } catch (e) { msg.style.color = "var(--bad)"; msg.textContent = "이 가계부의 백업 파일이 아니에요. '백업 파일 저장'으로 만든 .json 파일을 골라 주세요."; }
      file.value = "";
    });
    btns.append(exp, lab, file); box.append(btns, msg);
    const p = document.createElement("p"); p.className = "note"; p.textContent = "앱의 기록은 이 기기에만 저장돼요. 한 달에 한 번쯤 백업 파일을 저장해 두세요. 불러오면 지금 기기의 기록이 백업 내용으로 바뀌어요.";
    box.appendChild(p); sec.appendChild(box);
    return sec;
  }

  /* ---------- to-do ---------- */
  function renderTodo() {
    const root = $("view-todo"); root.innerHTML = "";
    const d = cur();
    const isDone = (t) => t.repeat ? !!d.todoDone[t.id] : !!t.done;
    const sec = document.createElement("section"); sec.className = "sec";
    const total = st.todos.length, done = st.todos.filter(isDone).length;
    sec.innerHTML = `<div class="sec-h"><h2>할 일 체크리스트</h2><span class="tot" style="display:flex;align-items:center;gap:10px">${st.m}월 <b>${done}/${total}</b><span class="progress" aria-hidden="true"><i style="width:${total ? done / total * 100 : 0}%"></i></span></span></div>`;
    const form = document.createElement("form"); form.className = "todo-add";
    form.innerHTML = `<input type="text" id="todoText" placeholder="할 일을 적고 Enter" aria-label="새 할 일" autocomplete="off"><label><input type="checkbox" id="todoRepeat"> 매달 반복</label><button class="btn" type="submit">추가</button>`;
    form.addEventListener("submit", (e) => {
      e.preventDefault(); const txt = $("todoText").value.trim(); if (!txt) return;
      st.todos.push({ id: uid(), text: txt, repeat: $("todoRepeat").checked, done: false });
      save("todos"); const rep = $("todoRepeat").checked; renderTodo(); $("todoRepeat").checked = rep; $("todoText").focus();
    });
    sec.appendChild(form);
    const list = [...st.todos].sort((a, b) => isDone(a) - isDone(b));
    if (!list.length) { const e = document.createElement("div"); e.className = "todo-empty"; e.textContent = "아직 할 일이 없어요. 위 칸에 적고 Enter를 누르면 추가돼요."; sec.appendChild(e); }
    for (const t of list) {
      const row = document.createElement("div"); row.className = "todo" + (isDone(t) ? " done" : "");
      const ck = document.createElement("input"); ck.type = "checkbox"; ck.id = "td-" + t.id; ck.checked = isDone(t);
      ck.addEventListener("change", () => {
        if (t.repeat) { cur().todoDone[t.id] = ck.checked; save("month"); } else { t.done = ck.checked; save("todos"); }
        renderTodo();
      });
      const lb = document.createElement("label"); lb.className = "txt"; lb.htmlFor = ck.id; lb.textContent = t.text;
      const chip = document.createElement("span"); chip.className = "chip" + (t.repeat ? " rep" : ""); chip.textContent = t.repeat ? "매달" : "한 번";
      chip.title = t.repeat ? "달이 바뀌면 다시 체크할 수 있어요" : "한 번 끝내면 완료로 남아요";
      const del = document.createElement("button"); del.className = "del"; del.textContent = "×"; del.setAttribute("aria-label", t.text + " 삭제");
      del.addEventListener("click", () => {
        if (del.dataset.confirm) { st.todos = st.todos.filter((x) => x !== t); save("todos"); renderTodo(); }
        else { del.dataset.confirm = "1"; del.textContent = "?"; setTimeout(() => { delete del.dataset.confirm; del.textContent = "×"; }, 2500); }
      });
      row.append(ck, lb, chip, del); sec.appendChild(row);
    }
    root.appendChild(sec);
    const note = document.createElement("p"); note.className = "note";
    note.textContent = "'매달' 항목은 달마다 따로 체크돼요. 위 화살표로 달을 넘기면 새 달은 다시 비어 있어요.";
    root.appendChild(note);
  }

  /* ---------- annual ---------- */
  function renderYear() {
    const root = $("view-year"); root.innerHTML = "";
    const sec = document.createElement("section"); sec.className = "sec";
    sec.innerHTML = `<div class="sec-h"><h2>${st.y}년 한눈에 보기</h2><span class="tot">실제 금액 기준</span></div>`;
    const wrap = document.createElement("div"); wrap.className = "scroll";
    const cols = ["수입", "저축·투자", "고정지출", "카드·변동", "남은 돈", "저축률", "손익(단기)", "손익(중장기)"];
    let html = `<table class="year"><thead><tr><th>월</th>${cols.map((c) => `<th>${c}</th>`).join("")}</tr></thead><tbody>`;
    const sum = [0, 0, 0, 0, 0, 0, 0, 0];
    for (let m = 1; m <= 12; m++) {
      const d = st.months[key(st.y, m)];
      const isCur = m === st.m;
      if (!d) { html += `<tr class="${isCur ? "cur" : ""}"><td>${m}월</td>${cols.map(() => `<td class="empty">–</td>`).join("")}</tr>`; continue; }
      const t = totals(d);
      let other = 0; for (const s of st.config.sections) if (!["save", "fixed", "card"].includes(s.id)) other += t[s.id].a;
      const inc = d.income || 0, sv = t.save?.a || 0, fx = (t.fixed?.a || 0) + other, cd = t.card?.a || 0;
      const left = inc - sv - fx - cd, ps = d.pnl?.short || 0, pl = d.pnl?.long || 0;
      [inc, sv, fx, cd, left, 0, ps, pl].forEach((v, i) => (sum[i] += v));
      const cls = (v) => (v > 0 ? "pos" : v < 0 ? "negv" : "");
      html += `<tr class="${isCur ? "cur" : ""}"><td>${m}월</td><td>${fmt(inc)}</td><td>${fmt(sv)}</td><td>${fmt(fx)}</td><td>${fmt(cd)}</td><td class="${left < 0 ? "negv" : ""}">${fmtSigned(left).replace(/^\+/, "")}</td><td>${inc ? Math.round(sv / inc * 100) + "%" : "–"}</td><td class="${cls(ps)}">${fmtSigned(ps)}</td><td class="${cls(pl)}">${fmtSigned(pl)}</td></tr>`;
    }
    const rate = sum[0] ? Math.round(sum[1] / sum[0] * 100) + "%" : "–";
    html += `</tbody><tfoot><tr><td>합계</td><td>${fmt(sum[0])}</td><td>${fmt(sum[1])}</td><td>${fmt(sum[2])}</td><td>${fmt(sum[3])}</td><td>${fmtSigned(sum[4]).replace(/^\+/, "")}</td><td>${rate}</td><td>${fmtSigned(sum[6])}</td><td>${fmtSigned(sum[7])}</td></tr></tfoot></table>`;
    wrap.innerHTML = html; sec.appendChild(wrap); root.appendChild(sec);
    root.appendChild(exportBox());
  }

  /* ---------- Google Sheets export (copy as tab-separated rows) ---------- */
  const tsv = (rows) => rows.map((r) => r.map((c) => String(c ?? "").replace(/[\t\n]/g, " ")).join("\t")).join("\n");
  function sheetMonth() {
    const d = cur(); const rows = [[`${st.y}년 ${st.m}월 가계부`], [], ["월 수입", d.income || 0], ["실현손익(미래에셋)-단기", d.pnl.short || 0], ["실현손익(키움+신한)-중장기", d.pnl.long || 0], []];
    for (const s of st.config.sections) {
      rows.push(["■ " + s.name, s.goalLabel, s.actLabel, "차이"]);
      let g = 0, a = 0;
      for (const it of s.items) { const v = d.v[it.id] || {}; g += v.g || 0; a += v.a || 0; rows.push([it.name, v.g || 0, v.a || 0, (v.a || 0) - (v.g || 0)]); }
      rows.push([s.name.replace(/\s*\(.*\)/, "") + " 소계", g, a, a - g], []);
    }
    if (d.memo) rows.push(["메모", d.memo]);
    return tsv(rows);
  }
  function sheetCal() {
    const d = cur(); const rows = [["날짜", "내용", "분류", "결제수단", "금액"]];
    Object.keys(d.cal || {}).map(Number).sort((a, b) => a - b).forEach((n) => d.cal[n].forEach((e) => rows.push([`${st.y}-${String(st.m).padStart(2, "0")}-${String(n).padStart(2, "0")}`, e.text, e.cat, e.pay || "", e.amt || 0])));
    return tsv(rows);
  }
  function sheetYear() {
    const rows = [["월", "수입", "저축·투자", "고정지출", "카드·변동", "남은 돈", "실현손익 단기", "실현손익 중장기"]];
    for (let m = 1; m <= 12; m++) {
      const d = st.months[key(st.y, m)]; if (!d) { rows.push([`${st.y}-${String(m).padStart(2, "0")}`]); continue; }
      const t = totals(d); let other = 0; for (const s of st.config.sections) if (!["save", "fixed", "card"].includes(s.id)) other += t[s.id].a;
      const inc = d.income || 0, sv = t.save?.a || 0, fx = (t.fixed?.a || 0) + other, cd = t.card?.a || 0;
      rows.push([`${st.y}-${String(m).padStart(2, "0")}`, inc, sv, fx, cd, inc - sv - fx - cd, d.pnl?.short || 0, d.pnl?.long || 0]);
    }
    return tsv(rows);
  }
  function sheetSubs() {
    const lab = { keep: "유지", review: "해지 고민", cancel: "해지함" };
    return tsv([["서비스명", "월 요금", "결제일", "결제수단", "상태"], ...st.subs.map((s) => [s.name, s.price || 0, s.day, s.method, lab[s.status] || "유지"])]);
  }
  function exportBox() {
    const sec = document.createElement("section"); sec.className = "sec";
    sec.innerHTML = `<div class="sec-h"><h2>구글 시트로 보내기</h2><span class="tot">복사 → 시트 A1 칸에 붙여넣기</span></div>`;
    const box = document.createElement("div"); box.className = "export";
    const btns = document.createElement("div"); btns.className = "btns";
    const msg = document.createElement("div"); msg.className = "msg"; msg.setAttribute("role", "status");
    const ta = document.createElement("textarea"); ta.id = "exportText"; ta.hidden = true; ta.readOnly = true; ta.setAttribute("aria-label", "복사할 내용");
    [[`${st.m}월 가계부`, sheetMonth], [`${st.m}월 달력 기록`, sheetCal], [`${st.y}년 연간 요약`, sheetYear], ["구독 목록", sheetSubs]].forEach(([label, fn]) => {
      const b = document.createElement("button"); b.className = "btn"; b.textContent = label + " 복사";
      b.addEventListener("click", () => {
        const text = fn(); ta.value = text;
        const fallback = () => { ta.hidden = false; ta.focus(); ta.select(); msg.textContent = "자동 복사가 막혀 있어요. 아래 선택된 내용을 Ctrl+C(⌘+C)로 복사하세요."; msg.style.color = "var(--warn)"; };
        try {
          navigator.clipboard.writeText(text).then(() => { ta.hidden = true; msg.style.color = ""; msg.textContent = `${label} 복사됨. 구글 시트에서 칸을 고르고 Ctrl+V(⌘+V) 하세요.`; }, fallback);
        } catch (e) { fallback(); }
      });
      btns.appendChild(b);
    });
    box.append(btns, msg, ta); sec.appendChild(box);
    return sec;
  }

  /* ---------- shell ---------- */
  function render() {
    $("monthLabel").textContent = `${st.y}.${String(st.m).padStart(2, "0")}`;
    const d = cur(); $("income").value = d.income ? fmt(d.income) : "";
    ["ledger", "cal", "subs", "todo", "year", "more"].forEach((t) => { $("view-" + t).hidden = st.tab !== t; $("t-" + t).setAttribute("aria-selected", st.tab === t); });
    $("ledgerTools").style.visibility = st.tab === "ledger" ? "visible" : "hidden";
    $("editBtn").classList.toggle("on", st.edit); $("editBtn").textContent = st.edit ? "편집 완료" : "항목 편집";
    renderLedger();
    if (st.tab === "subs") renderSubs();
    if (st.tab === "cal") renderCal();
    if (st.tab === "todo") renderTodo();
    if (st.tab === "year") renderYear();
    if (st.tab === "more") renderMore();
  }
  ["ledger", "cal", "subs", "todo", "year", "more"].forEach((t) => $("t-" + t).addEventListener("click", () => { st.tab = t; try { localStorage.setItem("ledger.tab", t); } catch (e) {} render(); }));
  $("prevM").addEventListener("click", () => { st.fresh = null; st.day = 0; if (--st.m < 1) { st.m = 12; st.y--; } render(); });
  $("nextM").addEventListener("click", () => { st.fresh = null; st.day = 0; if (++st.m > 12) { st.m = 1; st.y++; } render(); });
  $("editBtn").addEventListener("click", () => { st.edit = !st.edit; render(); });
  $("income").addEventListener("input", (e) => { cur().income = parse(e.target.value); recalc(); save("month"); });
  $("income").addEventListener("blur", (e) => { const n = parse(e.target.value); e.target.value = n ? fmt(n) : ""; });
  $("income").addEventListener("focus", (e) => e.target.select());
  $("copyPrev").addEventListener("click", () => {
    let py = st.y, pm = st.m - 1; if (pm < 1) { pm = 12; py--; }
    const prev = st.months[key(py, pm)]; const btn = $("copyPrev");
    if (!prev) { btn.textContent = `${pm}월 기록이 없어요`; setTimeout(() => (btn.textContent = "지난달 목표 불러오기"), 2200); return; }
    const d = cur(); let n = 0;
    for (const [id, v] of Object.entries(prev.v || {})) if (v.g && !(d.v[id]?.g)) { d.v[id] ||= {}; d.v[id].g = v.g; n++; }
    if (!d.income && prev.income) { d.income = prev.income; n++; }
    save("month"); renderLedger(); $("income").value = d.income ? fmt(d.income) : "";
    btn.textContent = n ? `${n}개 불러옴` : "비어 있는 칸이 없어요"; setTimeout(() => (btn.textContent = "지난달 목표 불러오기"), 2200);
  });

  render();
  (async () => {
    store = await connect();
    try { absorb(await store.load()); setSaveState(store.label); }
    catch (e) { store = localStore(); absorb(await store.load()); setSaveState("계정 저장소에 연결하지 못해 이 브라우저에 저장해요"); }
    render();
  })();
})();
</script>

<script>
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
