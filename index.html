<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2146b8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="가계부">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<script>window.LEDGER_STANDALONE = true;</script>
</head>
<body>
<title>월간 가계부</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400;0,600;0,800;1,600;1,800&family=Black+Han+Sans&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,400&family=Gowun+Dodum&family=Noto+Sans+KR:wght@300;400;500;700;900&family=Noto+Serif+KR:wght@400;600&family=Space+Mono:wght@400;700&display=swap">
<style>
/* Layout: sticker-board money app — chunky outlined cards with hard offset shadows, a poster-type hero for "남은 돈", pastel blocks per section, thumb-reach bottom tab bar */
:root {
  --bg: #efe9ff; --surface: #ffffff; --sunk: #f7f4ff; --ink: #1a1424; --muted: #6b6280; --line: #1a1424; --hair: #ddd6ee;
  --accent: #6c3cff; --accent-soft: #e6dcff; --good: #0f8a5f; --warn: #c2560c; --bad: #e0245e;
  --hero: #6c3cff; --hero-neg: #e0245e; --pop-save: #ffe066; --pop-fixed: #9fe3ff; --pop-card: #ffb3d1; --pop-pnl: #c7f5a8; --pop-misc: #ffd6a5;
  --shadow: 3px 3px 0 var(--line); --shadow-lg: 5px 5px 0 var(--line); --bw: 2px;
  --hero-ink: #fff; --mood-bg: #fff; --mood-ink: #1a1424; --stack-line: #1a1424; --s1: #ffe066; --s2: #9fe3ff; --s3: #ffb3d1;
  --on-accent: #fff; --check: #fff; --on-bg: var(--ink); --on-bg-muted: var(--muted);
  --display: "Black Han Sans", "Noto Sans KR", system-ui, sans-serif;
  --sans: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "Space Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15111d; --surface: #221b2e; --sunk: #1b1625; --ink: #f4efff; --muted: #a99fbf; --line: #f4efff; --hair: #3a3049;
  --accent: #a98bff; --accent-soft: #33275a; --good: #5fe0a8; --warn: #ffb067; --bad: #ff6f9a;
  --hero: #5530d6; --hero-neg: #c21d50; --pop-save: #6b5a12; --pop-fixed: #13506a; --pop-card: #6e2346; --pop-pnl: #2e5a1b; --pop-misc: #6b4316; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #15111d; --surface: #221b2e; --sunk: #1b1625; --ink: #f4efff; --muted: #a99fbf; --line: #f4efff; --hair: #3a3049;
  --accent: #a98bff; --accent-soft: #33275a; --good: #5fe0a8; --warn: #ffb067; --bad: #ff6f9a;
  --hero: #5530d6; --hero-neg: #c21d50; --pop-save: #6b5a12; --pop-fixed: #13506a; --pop-card: #6e2346; --pop-pnl: #2e5a1b; --pop-misc: #6b4316; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.5;
  background-image: radial-gradient(var(--hair) 1px, transparent 1px); background-size: 18px 18px; }
.wrap { max-width: 720px; margin: 0 auto; padding: 16px 16px calc(96px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 16px; }
.num, input.amt { font-family: var(--mono); font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, label.btn:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }

/* header */
header { color: var(--on-bg); display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: grid; gap: 0; }
.brand .hi { font-family: "Gowun Dodum", var(--sans); font-size: 13px; color: var(--on-bg-muted); }
h1 { font-family: var(--display); font-weight: 400; font-size: 28px; margin: 0; line-height: 1.1; letter-spacing: -0.01em; }
h1 em { font-style: normal; background: var(--pop-save); padding: 0 6px; border: var(--bw) solid var(--line); border-radius: 8px; display: inline-block; transform: rotate(-2deg); }
.save-state { font-size: 11.5px; color: var(--on-bg-muted); margin-top: 4px; }
.month { color: var(--ink); display: flex; align-items: center; gap: 2px; background: var(--surface); border: var(--bw) solid var(--line); border-radius: 999px; padding: 3px; box-shadow: var(--shadow); }
.month button { border: 0; background: transparent; width: 34px; height: 34px; border-radius: 999px; font-size: 18px; font-weight: 700; }
.month button:hover { background: var(--accent-soft); }
.month strong { min-width: 92px; text-align: center; font-family: var(--mono); font-size: 15px; }

/* hero */
.hero { position: relative; background: var(--hero); color: var(--hero-ink); border: var(--bw) solid var(--line); border-radius: 24px; padding: 20px 20px 18px; box-shadow: var(--shadow-lg); display: grid; gap: 14px; overflow: hidden; }
.hero::after { content: ""; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%; background: rgba(255,255,255,.12); pointer-events: none; }
.hero .lbl { font-size: 13px; font-weight: 700; opacity: .9; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.hero .big { font-family: var(--display); font-size: clamp(40px, 12vw, 64px); line-height: 1; letter-spacing: -0.02em; overflow-wrap: anywhere; }
.hero .big small { font-size: 0.42em; margin-left: 4px; }
.hero.neg { background: var(--hero-neg); }
.mood { justify-self: start; background: var(--mood-bg); color: var(--mood-ink); border: var(--bw) solid var(--stack-line); border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 700; transform: rotate(-1.5deg); }
.stack { display: flex; height: 14px; border-radius: 999px; overflow: hidden; border: var(--bw) solid var(--stack-line); background: rgba(255,255,255,.35); }
.stack i { display: block; height: 100%; }
.stack .s1 { background: var(--s1); } .stack .s2 { background: var(--s2); } .stack .s3 { background: var(--s3); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; opacity: .95; }
.legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; border: 1.5px solid var(--stack-line); vertical-align: -1px; }
.legend .l1::before { background: var(--s1); } .legend .l2::before { background: var(--s2); } .legend .l3::before { background: var(--s3); }
.hero .plan { font-size: 12px; opacity: .85; }

.chips { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.chipcard { background: var(--surface); border: var(--bw) solid var(--line); border-radius: 18px; padding: 12px 14px; box-shadow: var(--shadow); display: grid; gap: 2px; min-width: 0; }
.chipcard .k, .chipcard label { font-size: 12px; font-weight: 700; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.chipcard .k::before, .chipcard label::before { content: ""; width: 10px; height: 10px; border-radius: 50%; border: var(--bw) solid var(--line); background: var(--dot, var(--accent-soft)); }
.chipcard.c-inc { --dot: var(--pop-pnl); } .chipcard.c-save { --dot: var(--pop-save); } .chipcard.c-fixed { --dot: var(--pop-fixed); } .chipcard.c-card { --dot: var(--pop-card); }
.chipcard .v { font-family: var(--display); font-size: 22px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chipcard .s { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chipcard input.amt { width: 100%; font-family: var(--display); font-size: 22px; line-height: 1.2; border: 0; border-bottom: 2px dashed var(--hair); border-radius: 0; background: transparent; color: var(--ink); padding: 0; text-align: left; box-shadow: none; }
.chipcard input.amt:focus { border-bottom-color: var(--accent); }

/* tools row */
.tools { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: var(--bw) solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 13px; font-size: 12.5px; font-weight: 700; box-shadow: 2px 2px 0 var(--line); transition: transform .08s, box-shadow .08s; }
.btn:hover { background: var(--accent-soft); }
.btn:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--line); }
.btn.on { background: var(--ink); color: var(--surface); }

/* bottom tab bar */
.tabs { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 20; display: grid; grid-template-columns: repeat(6, 1fr); width: min(560px, calc(100% - 24px)); background: var(--surface); border: var(--bw) solid var(--line); border-radius: 22px; padding: 6px; box-shadow: var(--shadow-lg); }
.tabs button { border: 0; background: transparent; border-radius: 16px; padding: 6px 2px 5px; display: grid; justify-items: center; gap: 2px; font-size: 11px; font-weight: 700; color: var(--muted); }
.tabs button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--surface); }

/* cards & sections */
.panel { display: grid; gap: 16px; }
.sec { background: var(--surface); border: var(--bw) solid var(--line); border-radius: 20px; overflow: hidden; box-shadow: var(--shadow-lg); }
.sec-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 16px; background: var(--pop, var(--accent-soft)); border-bottom: var(--bw) solid var(--line); flex-wrap: wrap; }
.sec[data-sec="save"] { --pop: var(--pop-save); } .sec[data-sec="fixed"] { --pop: var(--pop-fixed); } .sec[data-sec="card"] { --pop: var(--pop-card); } .sec[data-sec="pnl"] { --pop: var(--pop-pnl); } .sec[data-sec="misc"] { --pop: var(--pop-misc); }
.sec-h h2 { font-family: var(--display); font-weight: 400; font-size: 18px; margin: 0; letter-spacing: -0.01em; }
.sec-h .tot { font-family: var(--mono); font-size: 12px; color: var(--ink); opacity: .85; }
.sec-h .tot b { font-weight: 700; opacity: 1; }
.sec-h .btn { box-shadow: 1.5px 1.5px 0 var(--line); }
.row { display: grid; grid-template-columns: minmax(0, 1fr) 108px 108px 84px; gap: 8px; align-items: center; padding: 8px 16px; border-bottom: 1.5px dashed var(--hair); }
.row:last-child { border-bottom: 0; }
.row.head { font-size: 11px; font-weight: 700; color: var(--muted); padding-block: 7px; border-bottom: 1.5px solid var(--hair); }
.row.head span:not(:first-child) { text-align: right; }
.name { min-width: 0; overflow-wrap: anywhere; font-weight: 500; }
.name input { width: 100%; font: inherit; border: var(--bw) solid var(--line); border-radius: 10px; padding: 4px 8px; background: var(--surface); color: var(--ink); }
.name-wrap { display: flex; gap: 6px; align-items: center; min-width: 0; }
.del { border: 0; background: transparent; color: var(--bad); font-size: 18px; font-weight: 700; padding: 0 4px; line-height: 1; }
input.amt { width: 100%; text-align: right; font-size: 13px; border: 2px solid var(--hair); border-radius: 12px; padding: 6px 8px; background: var(--sunk); color: var(--ink); }
input.amt::placeholder { color: var(--hair); }
input.amt:focus { border-color: var(--line); background: var(--surface); outline: none; box-shadow: 2px 2px 0 var(--accent); }
.diff { justify-self: end; font-family: var(--mono); font-size: 11.5px; font-weight: 700; white-space: nowrap; padding: 2px 8px; border-radius: 999px; }
.diff:empty { padding: 0; }
.diff.good { color: var(--good); background: color-mix(in srgb, var(--good) 14%, transparent); }
.diff.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }
.diff.bad { color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, transparent); }
.add { display: block; width: 100%; border: 0; border-top: 2px dashed var(--hair); background: transparent; padding: 10px 16px; text-align: center; color: var(--accent); font-size: 13px; font-weight: 700; }
.add:hover { background: var(--accent-soft); }
.pos { color: var(--good); } .negv { color: var(--bad); }
.meta { font-size: 11.5px; color: var(--muted); }

.pnl { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.pnl > div { padding: 12px 16px; display: grid; gap: 6px; border-left: 2px dashed var(--hair); }
.pnl > div:first-child { border-left: 0; }
.pnl label { font-size: 13px; font-weight: 700; }
.pnl .ytd { font-size: 12px; color: var(--muted); }
.memo textarea { width: 100%; min-height: 80px; border: 0; padding: 12px 16px; font: inherit; font-family: "Gowun Dodum", var(--sans); background: var(--surface); color: var(--ink); resize: vertical; display: block; }
.note { font-size: 12.5px; color: var(--on-bg-muted); margin: 0; }

/* subscriptions */
.subrow { display: grid; grid-template-columns: 28px minmax(0, 1.4fr) 100px 64px minmax(0, 1fr) 104px 24px; gap: 8px; align-items: center; padding: 8px 16px; border-bottom: 1.5px dashed var(--hair); }
.subrow.head { font-size: 11px; font-weight: 700; color: var(--muted); padding-block: 7px; }
.subrow input[type="text"], .subrow select { width: 100%; font: inherit; font-size: 13px; border: 2px solid var(--hair); border-radius: 10px; padding: 5px 7px; background: var(--sunk); color: var(--ink); min-width: 0; }
.subrow input[type="checkbox"], .todo input[type="checkbox"] { appearance: none; width: 22px; height: 22px; border: var(--bw) solid var(--line); border-radius: 7px; background: var(--surface); display: grid; place-content: center; margin: 0; cursor: pointer; }
.subrow input[type="checkbox"]:checked, .todo input[type="checkbox"]:checked { background: var(--accent); }
.subrow input[type="checkbox"]:checked::after, .todo input[type="checkbox"]:checked::after { content: ""; width: 10px; height: 6px; border-left: 3px solid var(--check); border-bottom: 3px solid var(--check); transform: rotate(-45deg) translate(1px, -1px); }
.subrow.cancel .sname, .subrow.cancel input.amt { text-decoration: line-through; color: var(--muted); }
.subrow.review { background: color-mix(in srgb, var(--pop-misc) 45%, transparent); }
.subsum { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px; background: var(--sunk); border-top: var(--bw) solid var(--line); font-size: 12.5px; color: var(--muted); }
.subsum span { background: var(--surface); border: 1.5px solid var(--hair); border-radius: 999px; padding: 3px 10px; }
.subsum b { font-family: var(--mono); color: var(--ink); }

/* annual */
.scroll { overflow-x: auto; }
table.year { border-collapse: collapse; width: 100%; min-width: 640px; font-size: 12.5px; }
table.year th, table.year td { padding: 8px 12px; border-bottom: 1.5px dashed var(--hair); text-align: right; white-space: nowrap; }
table.year th { font-size: 11px; color: var(--muted); font-weight: 700; background: var(--sunk); }
table.year td:first-child, table.year th:first-child { text-align: left; font-family: var(--sans); font-weight: 700; }
table.year td { font-family: var(--mono); }
table.year tr.cur td { background: var(--accent-soft); }
table.year tfoot td { font-weight: 700; border-top: var(--bw) solid var(--line); border-bottom: 0; }
table.year .empty { color: var(--hair); }

.export { display: grid; gap: 10px; padding: 14px 16px; }
.export .btns { display: flex; flex-wrap: wrap; gap: 8px; }
.export .msg { font-size: 12.5px; color: var(--good); min-height: 1.2em; }
.export textarea { width: 100%; min-height: 120px; font-family: var(--mono); font-size: 12px; border: var(--bw) solid var(--line); border-radius: 12px; padding: 8px; background: var(--sunk); color: var(--ink); }

/* calendar */
.cal-wrap { display: grid; gap: 16px; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; padding: 8px; }
.cal .dow { font-size: 11px; font-weight: 700; color: var(--muted); text-align: center; padding: 2px 0; }
.cal .dow:first-child { color: var(--bad); } .cal .dow:last-child { color: var(--accent); }
.cal button.day { border: 1.5px solid var(--hair); border-radius: 12px; background: var(--sunk); min-height: 62px; padding: 4px 5px; text-align: left; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.cal button.day:hover { border-color: var(--line); }
.cal button.day.has { background: var(--pop-card); border-color: var(--line); }
.cal button.day.sel { border: var(--bw) solid var(--line); box-shadow: 2px 2px 0 var(--line); background: var(--pop-save); }
.cal .dn { font-family: var(--mono); font-size: 12px; font-weight: 700; }
.cal .day.sun .dn { color: var(--bad); } .cal .day.sat .dn { color: var(--accent); }
.cal .day.today .dn { background: var(--ink); color: var(--surface); border-radius: 999px; padding: 0 6px; align-self: flex-start; }
.cal .dt { font-family: var(--mono); font-size: 10.5px; font-weight: 700; margin-top: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cal .dc { font-size: 10px; color: var(--ink); opacity: .75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cal .blank { min-height: 62px; }
.dayform { display: grid; grid-template-columns: minmax(0, 1fr) 112px; gap: 8px; padding: 12px 16px; border-bottom: 2px dashed var(--hair); }
.dayform input[type="text"], .dayform select { width: 100%; min-width: 0; font: inherit; font-size: 13px; border: 2px solid var(--hair); border-radius: 12px; padding: 7px 9px; background: var(--sunk); color: var(--ink); }
.dayform .btn, .todo-add .btn { grid-column: 1 / -1; background: var(--accent); color: var(--on-accent); padding: 9px; font-size: 14px; }
.dayform .btn:hover, .todo-add .btn:hover { background: var(--accent); filter: brightness(1.08); }
.entry { display: grid; grid-template-columns: minmax(0, 1fr) auto 24px; gap: 8px; align-items: center; padding: 9px 16px; border-bottom: 1.5px dashed var(--hair); }
.entry .num { font-size: 13px; font-weight: 700; }
.catlist { display: grid; gap: 8px; padding: 12px 16px; }
.catrow { display: grid; grid-template-columns: 76px minmax(0, 1fr) 84px; gap: 8px; align-items: center; font-size: 12.5px; font-weight: 500; }
.catrow .bar { height: 12px; background: var(--sunk); border: 1.5px solid var(--line); border-radius: 999px; overflow: hidden; }
.catrow .bar i { display: block; height: 100%; background: var(--pop-card); border-right: 1.5px solid var(--line); }
.catrow .num { text-align: right; }

/* to-do */
.todo-add { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; padding: 12px 16px; border-bottom: 2px dashed var(--hair); align-items: center; }
.todo-add input[type="text"] { min-width: 0; font: inherit; border: 2px solid var(--hair); border-radius: 12px; padding: 8px 10px; background: var(--sunk); color: var(--ink); }
.todo-add label { display: flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 700; color: var(--muted); }
.todo { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto 24px; gap: 10px; align-items: center; padding: 10px 16px; border-bottom: 1.5px dashed var(--hair); }
.todo:last-child { border-bottom: 0; }
.todo .txt { min-width: 0; overflow-wrap: anywhere; cursor: pointer; font-weight: 500; }
.todo.done .txt { text-decoration: line-through; color: var(--muted); }
.chip { font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 999px; border: 1.5px solid var(--hair); color: var(--muted); white-space: nowrap; }
.chip.rep { color: var(--ink); background: var(--pop-pnl); border-color: var(--line); }
.todo-empty { padding: 16px; color: var(--muted); font-size: 13px; text-align: center; }
.progress { height: 10px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 999px; overflow: hidden; width: 110px; }
.progress i { display: block; height: 100%; background: var(--accent); }

/* more */
.rules { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.rule { background: var(--surface); border: var(--bw) solid var(--line); border-radius: 18px; padding: 14px 16px; display: grid; gap: 8px; align-content: start; box-shadow: var(--shadow); }
.rule:nth-child(5n+1) { background: var(--pop-save); } .rule:nth-child(5n+3) { background: var(--pop-card); }
.rule .no { font-size: 11px; font-weight: 900; letter-spacing: 0.06em; justify-self: start; background: var(--ink); color: var(--surface); border-radius: 999px; padding: 1px 9px; }
.rule h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 19px; }
.rule p { margin: 0; color: var(--ink); opacity: .78; font-size: 13px; }
.rule .live { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; border-top: 2px dashed currentColor; padding-top: 8px; font-size: 12px; flex-wrap: wrap; opacity: .95; }
.rule .live b { font-family: var(--mono); font-size: 13.5px; }
.rule .live .ok { color: var(--good); } .rule .live .ng { color: var(--warn); }
.phases { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.phase { padding: 14px 16px; border-left: 2px dashed var(--hair); display: grid; gap: 6px; align-content: start; }
.phase:first-child { border-left: 0; }

.orb { width: 108px; height: 108px; border: 1px solid rgba(255,255,255,.92); border-radius: 50%; display: grid; place-content: center; text-align: center; gap: 0; margin-top: -26px; color: #fff; }
.orb:first-child { margin-top: 0; color: #1d3557; }
.orb b { font-family: "Newsreader", "Noto Serif KR", serif; font-weight: 400; font-size: 19px; line-height: 1.1; }
.orb i { font-style: normal; font-family: "Newsreader", serif; font-size: 13px; opacity: .9; }
.orbs::after { content: ""; position: absolute; left: calc(50% + 74px); top: 8px; bottom: 6px; width: 12px; border: 1px solid rgba(255,255,255,.85); border-left: 0; }
.orbs .vtext { position: absolute; left: calc(50% + 94px); top: 50%; transform: translateY(-50%); writing-mode: vertical-rl; font-size: 11.5px; font-weight: 300; letter-spacing: 0.12em; color: #fff; white-space: nowrap; }
/* trend curve (연간) */
.trend svg { display: block; width: 100%; height: auto; }
.trend .ln { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round; }
.trend .zero { stroke: var(--hair); stroke-dasharray: 4 4; }
.trend .pt { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }
.trend text { fill: var(--muted); font-size: 11px; font-family: var(--sans); }
.trend text.v { fill: var(--ink); font-weight: 700; }
.trend .empty { padding: 18px 16px; color: var(--muted); font-size: 13px; }
html[data-skin="ocean"] .trend { background: var(--noise), radial-gradient(ellipse at 18% 25%, rgba(255,255,255,.85), transparent 50%), linear-gradient(160deg, #dfe4e6 0%, #b7d4de 55%, #93bccd 100%); }
html[data-skin="ocean"] .trend .ln { stroke: #fff; stroke-width: 2.2; }
html[data-skin="ocean"] .trend .pt { fill: #fff; stroke: none; }
html[data-skin="ocean"] .trend text { fill: #1d3557; letter-spacing: 0.12em; font-size: 10.5px; }
html[data-skin="ocean"] .trend text.v { font-family: "Newsreader", serif; letter-spacing: 0; font-size: 13px; font-weight: 400; }
html[data-skin="ocean"] .trend .zero { stroke: rgba(29,53,87,.25); }
/* theme picker */
.skins { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; padding: 14px 16px; }
.skin { border: var(--bw) solid var(--hair); border-radius: 14px; background: var(--surface); padding: 6px; display: grid; gap: 6px; text-align: left; color: var(--ink); }
.skin[aria-pressed="true"] { border-color: var(--line); outline: 2px solid var(--accent); outline-offset: 1px; }
.skin .sw { height: 64px; border-radius: 9px; display: flex; align-items: flex-end; padding: 6px 8px; font-size: 18px; line-height: 1; }
.skin b { font-size: 12.5px; padding: 0 2px; }
.skin small { font-size: 11px; color: var(--muted); padding: 0 2px 2px; line-height: 1.3; }
.sw-pop { background: #6c3cff; color: #fff; font-family: "Black Han Sans", sans-serif; border: 2px solid #1a1424; }
.sw-swiss { background: #e7e7e4; color: #111; font-family: "Inter Tight", sans-serif; font-weight: 800; letter-spacing: -0.05em; font-size: 16px !important; border: 1px solid #111; }
.sw-swiss em { font-style: normal; background: #111; color: #e7e7e4; padding: 0 3px; }
.sw-ocean { background: radial-gradient(circle at 50% 46%, transparent 21px, rgba(255,255,255,.9) 22px, transparent 23px), linear-gradient(180deg, #e3e8eb 0%, #9dc7d4 40%, #2c5e86 80%, #142d50 100%); color: #fff; font-family: "Newsreader", serif; font-style: italic; }
.sw-soul { background: radial-gradient(circle at 25% 75%, rgba(234,168,86,.6), transparent 40%), radial-gradient(circle at 60% 25%, rgba(232,166,182,.7), transparent 40%), radial-gradient(circle at 85% 70%, rgba(190,184,210,.8), transparent 40%), #e4dcd1; color: #2b2622; font-weight: 300; }
@media (max-width: 560px) { .skins { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
</style>

<div class="wrap">
  <header>
    <div class="brand">
      <span class="hi" id="hiLine">오늘도 돈 관리 하는 중</span>
      <h1><em id="monthWord">10월</em> 머니로그</h1>
      <div class="save-state" id="saveState">불러오는 중…</div>
    </div>
    <div class="month" role="group" aria-label="월 선택">
      <button id="prevM" aria-label="이전 달">‹</button>

      <button id="nextM" aria-label="다음 달">›</button>

        <div class="orb"><b>저축</b><i id="orbSave">0</i></div>

        <span class="vtext" id="vtext">머니로그</span>

<script>
(() => {
  const DEFAULT_CONFIG = {
    sections: [
      { id: "save", name: "저축·투자", goalLabel: "목표액", actLabel: "실제납입", kind: "save", items: [
        { id: "s_house", name: "주택청약(NH)" }, { id: "s_cma", name: "CMA·현금성적금" },
        { id: "s_irp", name: "IRP(미래에셋)" }, { id: "s_pension", name: "연금저축(신한)" },
        { id: "s_trade", name: "일반매매·기타투자" } ] },
      { id: "fixed", name: "고정지출", goalLabel: "예산", actLabel: "실제", kind: "spend", items: [
        { id: "f_rent", name: "주거비(월세)" }, { id: "f_mgmt", name: "관리비·가스비" },
        { id: "f_loan1", name: "대출이자1(전세)" }, { id: "f_loan2", name: "대출이자2(신용)" },
        { id: "f_kbins", name: "KB보험" }, { id: "f_donate", name: "11청감+각종후원" },
        { id: "f_travel", name: "여행적금" }, { id: "f_parents", name: "엄빠적금" },
        { id: "f_living", name: "생활비통장" }, { id: "f_pingdol", name: "핑돌 적금" } ] },
      { id: "card", name: "카드값 (변동지출)", goalLabel: "예산", actLabel: "실제", kind: "spend", items: [
        { id: "c_cash", name: "현금지출 (당근등)" }, { id: "c_kb", name: "KB카드 *6일" },
        { id: "c_kbtr", name: "KB교통·K패스" }, { id: "c_kbtel", name: "KB통신" },
        { id: "c_hyundai", name: "현대카드" }, { id: "c_woori", name: "우리카드" },
        { id: "c_samsung", name: "삼성카드" }, { id: "c_shinhan", name: "신한카드" },
        { id: "c_transfer", name: "계좌이체" } ] }
    ]
  };
  const DEFAULT_SUBS = ["canva","네이버멤버십","유튜브프리미엄","클로드","쿠팡 로켓와우","제미나이","카카오톡서랍","카카오톡이모티콘플러스","노션","지니뮤직","티빙","쿠팡 스포츠패스","미리캔버스"]
    .map((name, i) => ({ id: "sub" + i, name, price: 0, day: "", method: "", status: "keep" }));

  const DEFAULT_TODOS = [
    { id: "td0", text: "카드값 실제 결제액 입력하기", repeat: true },
    { id: "td1", text: "저축·투자 실제 납입액 확인하기", repeat: true },
    { id: "td2", text: "실현손익 정리하기 (미래에셋 / 키움+신한)", repeat: true },
    { id: "td3", text: "구독 결제 내역 확인하고 안 쓰는 서비스 정리하기", repeat: true }
  ];
  const SKINS = [
    { id: "pop", name: "팝 스티커", desc: "통통 튀는 기본", sw: "sw-pop", mark: "₩", color: "#6c3cff" },
    { id: "swiss", name: "스위스", desc: "흑백 타이포 포스터", sw: "sw-swiss", mark: "<i>the</i>&nbsp;<em>money</em>", color: "#e7e7e4" },
    { id: "ocean", name: "오션", desc: "안개 낀 바다", sw: "sw-ocean", mark: "calm", color: "#9fc3d2" },
    { id: "soul", name: "소울", desc: "몸·마음·영혼", sw: "sw-soul", mark: "you", color: "#ddd5ca" }
  ];
  function applySkin(id) {
    if (id === "grass") id = "swiss";
    const sk = SKINS.find((x) => x.id === id) || SKINS[0];
    if (sk.id === "pop") delete document.documentElement.dataset.skin; else document.documentElement.dataset.skin = sk.id;
    document.querySelector('meta[name="theme-color"]')?.setAttribute("content", sk.color);
    return sk.id;
  }
  let skin = "pop"; try { skin = localStorage.getItem("ledger.skin") || "pop"; } catch (e) {}
  skin = applySkin(skin);
  const $ = (id) => document.getElementById(id);
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const fmt = (n) => (Math.round(n) || 0).toLocaleString("ko-KR");
  const fmtSigned = (n) => (n > 0 ? "+" : n < 0 ? "−" : "") + fmt(Math.abs(n));
  const parse = (s) => { const neg = /^\s*-/.test(s); const d = String(s).replace(/[^0-9]/g, ""); return d ? (neg ? -1 : 1) * parseInt(d, 10) : 0; };
  const uid = () => "x" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

  const st = {
    y: new Date().getFullYear(), m: new Date().getMonth() + 1,
    config: clone(DEFAULT_CONFIG), subs: clone(DEFAULT_SUBS), todos: clone(DEFAULT_TODOS), months: {}, tab: "ledger", edit: false, fresh: null
  };
  try { const t = localStorage.getItem("ledger.tab"); if (t) st.tab = t; } catch (e) {}
  const key = (y, m) => `m-${y}-${String(m).padStart(2, "0")}`;
  const hasBudget = (m) => !!m && (m.income || Object.values(m.v || {}).some((v) => v && v.g));
  const cur = () => {
    const k = key(st.y, st.m);
    if (!st.months[k]) {
      const fresh = { income: 0, v: {}, pnl: { short: 0, long: 0 }, subsPaid: {}, todoDone: {}, memo: "" };
      const prevKey = Object.keys(st.months).filter((x) => x < k && hasBudget(st.months[x])).sort().pop();
      if (prevKey) {
        const pv = st.months[prevKey];
        fresh.income = pv.income || 0;
        for (const [id, v] of Object.entries(pv.v || {})) if (v && v.g) fresh.v[id] = { g: v.g };
        fresh.carriedFrom = prevKey;
      }
      st.months[k] = fresh;
    }
    const d = st.months[k]; d.v ||= {}; d.pnl ||= { short: 0, long: 0 }; d.subsPaid ||= {}; d.todoDone ||= {};
    return d;
  };

  /* ---------- storage: private db subtree, else this browser ---------- */
  let store = null; // {write(docId, data)}
  const pending = new Map(); let timer = null; let writing = false;
  function setSaveState(t) { $("saveState").textContent = t; }
  function queue(docId) { pending.set(docId, true); setSaveState("저장 중…"); clearTimeout(timer); timer = setTimeout(flush, 700); }
  async function flush() {
    if (writing || !store) { timer = setTimeout(flush, 300); return; }
    writing = true;
    const ids = [...pending.keys()]; pending.clear();
    try {
      for (const id of ids) {
        const data = id === "config" ? { sections: st.config.sections } : id === "subs" ? { list: st.subs } : id === "todos" ? { list: st.todos } : st.months[id];
        if (data) await store.write(id, clone(data));
      }
      setSaveState(store.label + " · 저장됨");
    } catch (e) {
      setSaveState("저장하지 못했어요. 연결을 확인한 뒤 다시 입력해 주세요.");
    } finally { writing = false; }
  }
  const save = (what) => { if (what === "month") delete cur().carriedFrom; queue(what === "month" ? key(st.y, st.m) : what); };

  function localStore() {
    return {
      label: "이 브라우저에 저장",
      async load() {
        try { const raw = localStorage.getItem("ledger.data"); return raw ? JSON.parse(raw) : {}; } catch (e) { return {}; }
      },
      async write(id, data) {
        let all = {}; try { all = JSON.parse(localStorage.getItem("ledger.data") || "{}"); } catch (e) {}
        all[id] = data; try { localStorage.setItem("ledger.data", JSON.stringify(all)); } catch (e) { throw e; }
      }
    };
  }

  async function connect() {
    let db = null, uidv = null;
    try {
      const claude = window.claude;
      if (claude?.use) {
        const [d, u] = await Promise.all([claude.use("db"), claude.use("user")]);
        db = d; uidv = u ? await u.id() : null;
      }
    } catch (e) {}
    if (db && uidv) {
      const base = "data/users/" + uidv;
      return {
        label: "내 계정에 저장",
        async load() {
          const snap = await db.collection(base).get();
          const out = {}; snap.docs.forEach((d) => { if (d.exists) out[d.id] = d.data(); });
          return out;
        },
        async write(id, data) { await db.doc(base + "/" + id).set(data); }
      };
    }
    return localStore();
  }

  function absorb(all) {
    for (const [id, d] of Object.entries(all || {})) {
      if (id === "config" && d?.sections?.length) st.config = clone(d);
      else if (id === "subs" && Array.isArray(d?.list)) st.subs = clone(d.list);
      else if (id === "todos" && Array.isArray(d?.list)) st.todos = clone(d.list);
      else if (id.startsWith("m-")) st.months[id] = clone(d);
    }
  }

  /* ---------- totals ---------- */
  function totals(d) {
    const t = {};
    for (const s of st.config.sections) {
      let g = 0, a = 0;
      for (const it of s.items) { const v = d.v?.[it.id]; if (v) { g += v.g || 0; a += v.a || 0; } }
      t[s.id] = { g, a };
    }
    return t;
  }
  function recalc() {
    const d = cur(); const t = totals(d);
    const save = t.save || { g: 0, a: 0 }, fixed = t.fixed || { g: 0, a: 0 }, card = t.card || { g: 0, a: 0 };
    let otherA = 0, otherG = 0;
    for (const s of st.config.sections) if (!["save", "fixed", "card"].includes(s.id)) { otherA += t[s.id].a; otherG += t[s.id].g; }
    $("sumSave").textContent = fmt(save.a);
    $("saveRate").textContent = d.income ? `저축률 ${Math.round(save.a / d.income * 100)}% · 목표 ${fmt(save.g)}` : `목표 ${fmt(save.g)}`;
    $("sumFixed").textContent = fmt(fixed.a + otherA);
    $("fixedGoal").textContent = "예산 " + fmt(fixed.g + otherG);
    $("sumCard").textContent = fmt(card.a);
    $("cardGoal").textContent = "예산 " + fmt(card.g);
    const left = (d.income || 0) - save.a - fixed.a - card.a - otherA;
    const plan = (d.income || 0) - save.g - fixed.g - card.g - otherG;
    $("sumLeft").textContent = fmtSigned(left).replace(/^\+/, "");
    $("leftBox").classList.toggle("neg", left < 0);
    const short = (n) => { n = Math.round(n || 0); if (Math.abs(n) >= 10000) { const v = n / 10000; return (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 10) / 10).toLocaleString("ko-KR") + "만"; } return fmt(n); };
    $("orbSave").textContent = short(save.a); $("orbFixed").textContent = short(fixed.a + otherA); $("orbCard").textContent = short(card.a);
    $("vtext").textContent = `${st.y} · ${st.m}월 머니로그`;
    { const n = new Date(); $("pmTime").textContent = n.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }); $("pmDate").textContent = `${st.m}/${n.getDate()}/${st.y}`; }
    const inc = d.income || 0, segs = [save.a, fixed.a + otherA, card.a];
    const base = Math.max(inc, segs[0] + segs[1] + segs[2], 1);
    document.querySelectorAll("#stack i").forEach((el, i) => (el.style.width = (segs[i] / base * 100) + "%"));
    const spentPct = inc ? Math.round((fixed.a + otherA + card.a) / inc * 100) : 0;
    $("mood").textContent = !inc ? "월 수입부터 적어 볼까요?"
      : left < 0 ? `수입보다 ${fmt(-left)}원 더 나갔어요`
      : card.g && card.a > card.g ? `카드값이 예산을 ${fmt(card.a - card.g)}원 넘었어요`
      : save.g && save.a >= save.g ? `저축 목표 달성! 수입의 ${spentPct}%만 썼어요`
      : `수입의 ${spentPct}% 썼어요 · 아직 여유 있어요`;
    $("leftPlan").textContent = "계획 기준 " + fmtSigned(plan).replace(/^\+/, "");
    for (const s of st.config.sections) {
      const el = document.querySelector(`[data-tot="${s.id}"]`);
      if (el) el.innerHTML = `${s.goalLabel} ${fmt(t[s.id].g)} · ${s.actLabel} <b>${fmt(t[s.id].a)}</b>`;
      for (const it of s.items) {
        const el2 = document.querySelector(`[data-diff="${it.id}"]`); if (!el2) continue;
        const v = d.v[it.id] || {}; const g = v.g || 0, a = v.a || 0;
        el2.className = "diff";
        if (!g && !a) { el2.textContent = ""; continue; }

      <div class="subrow head"><span>✓</span><span>서비스명</span><span style="text-align:right">월 요금</span><span class="c-day">결제일</span><span class="c-method">결제수단</span><span class="c-status">상태</span><span></span></div>`;

  function subTotals() {
    const el = $("subsum"); if (!el) return;
    const d = cur();
    const active = st.subs.filter((s) => s.status !== "cancel");
    const monthly = active.reduce((a, s) => a + (s.price || 0), 0);
    const review = st.subs.filter((s) => s.status === "review").reduce((a, s) => a + (s.price || 0), 0);
    const cancelled = st.subs.filter((s) => s.status === "cancel").reduce((a, s) => a + (s.price || 0), 0);
    const checked = active.filter((s) => d.subsPaid[s.id]).length;
    el.innerHTML = `<span>사용 중 ${active.length}개 · 월 <b>${fmt(monthly)}</b>원</span><span>연간 <b>${fmt(monthly * 12)}</b>원</span><span>해지 고민 중 <b>${fmt(review)}</b>원/월</span><span>해지로 아낀 돈 <b>${fmt(cancelled)}</b>원/월</span><span>${st.m}월 결제 확인 <b>${checked}/${active.length}</b></span>`;
  }

  /* ---------- calendar ---------- */
  const CATS = ["식비", "카페·간식", "교통", "쇼핑", "생활용품", "의료·건강", "문화·여가", "경조사·선물", "모임·한턱", "자기계발", "기타"];
  function renderCal() {
    const root = $("view-cal"); root.innerHTML = "";
    const d = cur(); d.cal ||= {};
    const days = new Date(st.y, st.m, 0).getDate();
    const first = new Date(st.y, st.m - 1, 1).getDay();
    const today = new Date(); const isThisMonth = today.getFullYear() === st.y && today.getMonth() + 1 === st.m;
    if (!st.day || st.day > days) st.day = isThisMonth ? today.getDate() : 1;
    const dayTotal = (n) => (d.cal[n] || []).reduce((a, e) => a + (e.amt || 0), 0);
    const monthTotal = Object.keys(d.cal).reduce((a, n) => a + dayTotal(n), 0);

    const wrap = document.createElement("div"); wrap.className = "cal-wrap";
    // grid
    const left = document.createElement("section"); left.className = "sec";
    left.innerHTML = `<div class="sec-h"><h2>${st.m}월 소비 달력</h2><span class="tot">이번 달 <b>${fmt(monthTotal)}</b>원</span></div>`;

    ["일", "월", "화", "수", "목", "금", "토"].forEach((w) => { const e = document.createElement("div"); e.className = "dow"; e.textContent = w; grid.appendChild(e); });
    for (let i = 0; i < first; i++) { const b = document.createElement("div"); b.className = "blank"; grid.appendChild(b); }
    for (let n = 1; n <= days; n++) {
      const dow = (first + n - 1) % 7;
      const b = document.createElement("button"); b.className = "day" + (dow === 0 ? " sun" : dow === 6 ? " sat" : "") + (n === st.day ? " sel" : "") + (isThisMonth && n === today.getDate() ? " today" : "");
      const list = d.cal[n] || []; const t = dayTotal(n); if (list.length) b.classList.add("has");
      b.setAttribute("aria-label", `${st.m}월 ${n}일${t ? ", " + fmt(t) + "원" : ""}`);
      b.innerHTML = `<span class="dn">${n}</span>`;

    const dayBox = document.createElement("section"); dayBox.className = "sec";

    dayBox.innerHTML = `<div class="sec-h"><h2>${st.m}월 ${st.day}일 (${wd})</h2><span class="tot">합계 <b>${fmt(dayTotal(st.day))}</b>원</span></div>`;
    const form = document.createElement("form"); form.className = "dayform";

    form.innerHTML = `<input type="text" id="ceText" placeholder="어디에 썼나요? (예: 점심, 다이소)" aria-label="소비 내용" autocomplete="off">
      <input type="text" id="ceAmt" class="amt" inputmode="numeric" placeholder="금액" aria-label="금액" autocomplete="off">
      <select id="ceCat" aria-label="분류">${CATS.map((c) => `<option>${c}</option>`).join("")}</select>
      <select id="cePay" aria-label="결제수단"><option value="">결제수단 (선택)</option>${pays.map((c) => `<option value="${c.id}">${c.name.replace(/[<>&"]/g, "")}</option>`).join("")}</select>
      <button class="btn" type="submit">${st.day}일에 추가</button>`;
    try { const lc = localStorage.getItem("ledger.lastCat"); const lp = localStorage.getItem("ledger.lastPay"); if (lc) form.querySelector("#ceCat").value = lc; if (lp) form.querySelector("#cePay").value = lp; } catch (e) {}
    const amtEl = form.querySelector("#ceAmt");
    amtEl.addEventListener("blur", () => { const n = parse(amtEl.value); amtEl.value = n ? fmt(n) : ""; });
    form.addEventListener("submit", (e) => {
      e.preventDefault();

    root.appendChild(note);
  }

  /* ---------- more: money principles ---------- */
  function renderMore() {
    const root = $("view-more"); root.innerHTML = "";
    const d = cur(); const t = totals(d); const cal = Object.values(d.cal || {}).flat();
    const catSum = (names) => cal.filter((e) => names.includes(e.cat)).reduce((a, e) => a + (e.amt || 0), 0);
    const sv = t.save || { g: 0, a: 0 };
    const donate = d.v?.f_donate?.a || 0;

  /* ---------- 월별 남은 돈 곡선 ---------- */
  function trendBox() {
    const sec = document.createElement("section"); sec.className = "sec trend";
    sec.innerHTML = `<div class="sec-h"><h2>남은 돈의 흐름</h2><span class="tot">${st.y}년 · 매달 똑같을 필요는 없어요</span></div>`;
    const pts = [];
    for (let m = 1; m <= 12; m++) {
      const d = st.months[key(st.y, m)]; if (!d || !hasBudget(d) && !d.income) continue;
      const t = totals(d); let other = 0; for (const s of st.config.sections) if (!["save", "fixed", "card"].includes(s.id)) other += t[s.id].a;
      pts.push({ m, v: (d.income || 0) - (t.save?.a || 0) - (t.fixed?.a || 0) - other - (t.card?.a || 0) });
    }
    if (pts.length < 2) { const e = document.createElement("div"); e.className = "empty"; e.textContent = "두 달 이상 기록하면 남은 돈이 어떻게 오르내렸는지 곡선으로 보여드려요."; sec.appendChild(e); return sec; }
    const W = 360, H = 190, L = 26, R = 26, T = 38, B = 28;
    const vs = pts.map((p) => p.v); const lo = Math.min(0, ...vs), hi = Math.max(...vs, 1);
    const m0 = pts[0].m, m1 = pts[pts.length - 1].m; const X = (m) => L + (m - m0) * (W - L - R) / Math.max(1, m1 - m0), Y = (v) => T + (hi - v) / (hi - lo || 1) * (H - T - B);
    const P = pts.map((p) => [X(p.m), Y(p.v)]);
    let d = `M${P[0][0]},${P[0][1]}`;
    for (let i = 0; i < P.length - 1; i++) {
      const p0 = P[i - 1] || P[i], p1 = P[i], p2 = P[i + 1], p3 = P[i + 2] || p2;
      d += ` C${p1[0] + (p2[0] - p0[0]) / 6},${p1[1] + (p2[1] - p0[1]) / 6} ${p2[0] - (p3[0] - p1[0]) / 6},${p2[1] - (p3[1] - p1[1]) / 6} ${p2[0]},${p2[1]}`;
    }
    const sh = (n) => (Math.abs(n) >= 10000 ? Math.round(n / 1000) / 10 + "만" : fmt(n));
    let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${st.y}년 월별 남은 돈">`;
    if (lo < 0) svg += `<line class="zero" x1="${L}" x2="${W - R}" y1="${Y(0)}" y2="${Y(0)}"/>`;
    svg += `<path class="ln" d="${d}"/>`;
    pts.forEach((p, i) => { const [x, y] = P[i]; svg += `<circle class="pt" cx="${x}" cy="${y}" r="4"/><text class="v" x="${x}" y="${y - 12}" text-anchor="middle">${sh(p.v)}</text><text x="${x}" y="${H - 10}" text-anchor="middle">${p.m}월</text>`; });
    svg += `</svg>`;
    const box = document.createElement("div"); box.style.padding = "4px 8px 6px"; box.innerHTML = svg; sec.appendChild(box);
    return sec;
  }

  /* ---------- Google Sheets export (copy as tab-separated rows) ---------- */
  const tsv = (rows) => rows.map((r) => r.map((c) => String(c ?? "").replace(/[\t\n]/g, " ")).join("\t")).join("\n");
  function sheetMonth() {
    const d = cur(); const rows = [[`${st.y}년 ${st.m}월 가계부`], [], ["월 수입", d.income || 0], ["실현손익(미래에셋)-단기", d.pnl.short || 0], ["실현손익(키움+신한)-중장기", d.pnl.long || 0], []];
    for (const s of st.config.sections) {
      rows.push(["■ " + s.name, s.goalLabel, s.actLabel, "차이"]);
      let g = 0, a = 0;
      for (const it of s.items) { const v = d.v[it.id] || {}; g += v.g || 0; a += v.a || 0; rows.push([it.name, v.g || 0, v.a || 0, (v.a || 0) - (v.g || 0)]); }
      rows.push([s.name.replace(/\s*\(.*\)/, "") + " 소계", g, a, a - g], []);
    }
    if (d.memo) rows.push(["메모", d.memo]);
    return tsv(rows);
  }

  function exportBox() {
    const sec = document.createElement("section"); sec.className = "sec";
    sec.innerHTML = `<div class="sec-h"><h2>구글 시트로 보내기</h2><span class="tot">복사 → 시트 A1 칸에 붙여넣기</span></div>`;
    const box = document.createElement("div"); box.className = "export";
    const btns = document.createElement("div"); btns.className = "btns";
    const msg = document.createElement("div"); msg.className = "msg"; msg.setAttribute("role", "status");
    const ta = document.createElement("textarea"); ta.id = "exportText"; ta.hidden = true; ta.readOnly = true; ta.setAttribute("aria-label", "복사할 내용");
    [[`${st.m}월 가계부`, sheetMonth], [`${st.m}월 달력 기록`, sheetCal], [`${st.y}년 연간 요약`, sheetYear], ["구독 목록", sheetSubs]].forEach(([label, fn]) => {
      const b = document.createElement("button"); b.className = "btn"; b.textContent = label + " 복사";
      b.addEventListener("click", () => {
        const text = fn(); ta.value = text;
        const fallback = () => { ta.hidden = false; ta.focus(); ta.select(); msg.textContent = "자동 복사가 막혀 있어요. 아래 선택된 내용을 Ctrl+C(⌘+C)로 복사하세요."; msg.style.color = "var(--warn)"; };
        try {
          navigator.clipboard.writeText(text).then(() => { ta.hidden = true; msg.style.color = ""; msg.textContent = `${label} 복사됨. 구글 시트에서 칸을 고르고 Ctrl+V(⌘+V) 하세요.`; }, fallback);
        } catch (e) { fallback(); }
      });
      btns.appendChild(b);
    });
    box.append(btns, msg, ta); sec.appendChild(box);
    return sec;
  }

  /* ---------- shell ---------- */
  function render() {
    $("monthLabel").textContent = `${st.y}.${String(st.m).padStart(2, "0")}`;
    const d = cur(); $("income").value = d.income ? fmt(d.income) : "";
    ["ledger", "cal", "subs", "todo", "year", "more"].forEach((t) => { $("view-" + t).hidden = st.tab !== t; $("t-" + t).setAttribute("aria-selected", st.tab === t); });
    $("dash").hidden = st.tab !== "ledger"; $("monthWord").textContent = st.m + "월";
    $("editBtn").classList.toggle("on", st.edit); $("editBtn").textContent = st.edit ? "편집 완료" : "항목 편집";
    renderLedger();
    if (st.tab === "subs") renderSubs();
    if (st.tab === "cal") renderCal();
    if (st.tab === "todo") renderTodo();
    if (st.tab === "year") renderYear();
    if (st.tab === "more") renderMore();
  }
  ["ledger", "cal", "subs", "todo", "year", "more"].forEach((t) => $("t-" + t).addEventListener("click", () => { st.tab = t; try { localStorage.setItem("ledger.tab", t); } catch (e) {} render(); }));
  $("prevM").addEventListener("click", () => { st.fresh = null; st.day = 0; if (--st.m < 1) { st.m = 12; st.y--; } render(); });
  $("nextM").addEventListener("click", () => { st.fresh = null; st.day = 0; if (++st.m > 12) { st.m = 1; st.y++; } render(); });
  $("editBtn").addEventListener("click", () => { st.edit = !st.edit; render(); });
  $("income").addEventListener("input", (e) => { cur().income = parse(e.target.value); recalc(); save("month"); });
  $("income").addEventListener("blur", (e) => { const n = parse(e.target.value); e.target.value = n ? fmt(n) : ""; });
  $("income").addEventListener("focus", (e) => e.target.select());
  $("copyPrev").addEventListener("click", () => {
    let py = st.y, pm = st.m - 1; if (pm < 1) { pm = 12; py--; }
    const prev = st.months[key(py, pm)]; const btn = $("copyPrev");
    if (!prev) { btn.textContent = `${pm}월 기록이 없어요`; setTimeout(() => (btn.textContent = "지난달 목표 불러오기"), 2200); return; }
    const d = cur(); let n = 0;
    for (const [id, v] of Object.entries(prev.v || {})) if (v.g && !(d.v[id]?.g)) { d.v[id] ||= {}; d.v[id].g = v.g; n++; }
    if (!d.income && prev.income) { d.income = prev.income; n++; }
    save("month"); renderLedger(); $("income").value = d.income ? fmt(d.income) : "";
    btn.textContent = n ? `${n}개 불러옴` : "비어 있는 칸이 없어요"; setTimeout(() => (btn.textContent = "지난달 목표 불러오기"), 2200);
  });

  render();
  (async () => {
    store = await connect();
    try { const all = await store.load(); st.months = {}; absorb(all); setSaveState(store.label); }
    catch (e) { store = localStore(); st.months = {}; absorb(await store.load()); setSaveState("계정 저장소에 연결하지 못해 이 브라우저에 저장해요"); }
    render();
  })();
})();
</script>

<script>
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
